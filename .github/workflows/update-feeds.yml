name: Update filtered feeds

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past (UTC)
  push:
    paths:
      - "docs/feeds.json"    # rebuild right away when the web page saves a change
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build filtered feeds
        run: python3 filter_feed.py

      - name: Publish if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs/feeds
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update filtered feeds"
            git pull --rebase
            git push
          fi
